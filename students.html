<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students | Student Attendance System</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #263238;
        }

        .navbar {
            background: #243b55;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .navbar h2 {
            color: white;
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
            font-size: 14px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .page-heading {
            margin-bottom: 25px;
        }

        .page-heading h1 {
            margin-bottom: 8px;
        }

        .page-heading p {
            color: #607080;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
            margin-bottom: 25px;
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input {
            padding: 12px;
            border: 1px solid #ccd5df;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            width: 100%;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2878c8;
        }

        .primary-btn {
            margin-top: 20px;
            background: #2878c8;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .primary-btn:hover {
            background: #1d5f9f;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th, td {
            text-align: left;
            padding: 14px 12px;
            border-bottom: 1px solid #e5eaf0;
        }

        th {
            background: #f0f4f8;
            font-size: 14px;
        }

        td {
            font-size: 14px;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #b52a37;
        }

        .empty-message {
            color: #657586;
            padding: 20px 0;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .navbar {
                padding: 16px;
            }

            .navbar a {
                margin-left: 0;
                margin-right: 12px;
            }

            .container {
                margin-top: 20px;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <h2>Student Attendance</h2>

        <div>
            <a href="dashboard.html">Dashboard</a>
            <a href="students.html">Students</a>
            <a href="attendance.html">Attendance</a>
            <a href="reports.html">Reports</a>
            <a href="#" id="logoutBtn">Logout</a>
        </div>
    </nav>

    <main class="container">

        <section class="page-heading">
            <h1>Manage Students</h1>
            <p>Add students and manage their details in the cloud database.</p>
        </section>

        <section class="card">
            <h2>Add New Student</h2>

            <form id="studentForm">
                <div class="form-grid">

                    <div class="form-group">
                        <label for="rollNumber">Roll Number</label>
                        <input
                            type="text"
                            id="rollNumber"
                            placeholder="e.g. 22IT001"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="studentName">Student Name</label>
                        <input
                            type="text"
                            id="studentName"
                            placeholder="Enter student name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address (Optional)</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="student@example.com"
                        >
                    </div>

                    <div class="form-group">
                        <label for="department">Department</label>
                        <input
                            type="text"
                            id="department"
                            placeholder="e.g. Information Technology"
                            required
                        >
                    </div>

                </div>

                <button type="submit" class="primary-btn" id="addStudentBtn">
                    Add Student
                </button>

                <p id="formMessage" class="message" role="status"></p>
            </form>
        </section>

        <section class="card">
            <h2>Student List</h2>

            <p id="studentCount">Loading students...</p>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Roll Number</th>
                            <th>Student Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="studentTableBody">
                        <tr>
                            <td colspan="5">Loading students...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <p id="listMessage" class="message" role="status"></p>
        </section>

    </main>

    <script type="module" src="js/students.js"></script>

</body>
</html>
